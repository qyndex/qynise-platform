name: Adopter readiness baseline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adopter-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  process-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate installed process files
        shell: bash
        run: |
          set -euo pipefail
          bash .claude/scripts/validate.sh --json | tee "$RUNNER_TEMP/process-validation.json"
  application-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require an implemented application verification contract
        shell: bash
        run: |
          if [ ! -x scripts/verify-application.sh ]; then
            echo '::error::Missing approved application verification contract: scripts/verify-application.sh. Product scope remains draft; harness installation is not application readiness.'
            exit 1
          fi
          bash scripts/verify-application.sh
